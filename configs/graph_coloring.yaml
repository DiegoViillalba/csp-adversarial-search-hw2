# Parameters for experiments/run_graph_coloring.py and experiments/compare_coloring.py
seed: 42

# Instancias oficiales provistas para la tarea (no generadas: ensure_instance()
# solo genera un grafo aleatorio si el path no existe todavia, asi que con
# estos archivos ya en data/graphs/ esa rama nunca se ejecuta). Nombradas
# gc_50_7 / gc_1000_9 por quien las proveyo -- el sufijo probablemente indica
# el numero de colores esperado, pero eso lo confirma el propio solver, no se
# asume aqui.
instances:
  - name: small
    path: data/graphs/gc_50_7.txt
  - name: large
    path: data/graphs/gc_1000_9.txt

# k search range: for each instance, try k = k_min..k_max and keep the smallest
# feasible k found (per method), capped by the time budget below. Raised from
# 2-12 after measuring real bounds on the official graphs: gc_50_7 has a
# clique of size ~10 (k<10 is PROVABLY infeasible) and a greedy coloring
# using 17 colors (a valid, achievable upper bound); gc_1000_9 has a clique
# of size ~49 and a greedy coloring using 315 -- ie. its true chromatic
# number is nowhere near what its filename suggests. 10-70 covers gc_50_7's
# whole feasible range comfortably; for gc_1000_9 it's a partial probe (its
# greedy upper bound is 315, out of reach for a full linear sweep here) --
# see results/tables/graph_coloring_k_sweep.csv for every k actually tried.
k_min: 10
k_max: 70

backtracking:
  use_forward_checking: true
  use_ac3: true  # cheap now: build_graph_coloring_csp sets problem.neighbors,
                 # so ac3() only walks real edges (~O(E)), not every vertex pair
  time_limit_seconds: 120

metaheuristic:
  initial_temperature: 10.0
  cooling_rate: 0.995
  max_iterations: 100000
  time_limit_seconds: 120

ortools:
  time_limit_seconds: 60
